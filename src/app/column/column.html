<div
  class="column-container"
  cdkDropList
  [id]="column().id"
  [cdkDropListData]="column().tasks ?? []"
  [cdkDropListConnectedTo]="connectedLists()"
  (cdkDropListDropped)="taskDropped.emit($event)"
>
  <div class="title">
    <h2>{{ column().title }}</h2>

    <div class="buttons">
      <button (click)="addTask(column().id)">
        <mat-icon aria-hidden="false" aria-label="add icon" fontIcon="add"></mat-icon>
      </button>

      <button
        matIconButton
        [disableRipple]="true"
        [matMenuTriggerFor]="menu"
        aria-label="Example icon-button with a menu"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu" xPosition="before">
        <button mat-menu-item (click)="deleteColumn(column())">
          <span>Delete</span>
        </button>
      </mat-menu>
    </div>
  </div>

  @for (task of column().tasks ?? []; track $index) {
    <app-card [task]="task" [columnId]="column().id" />
  }

  <button dottedButtonStyle type="button" (click)="addTask(column().id)">
    <mat-icon aria-hidden="false" aria-label="add icon" fontIcon="add"></mat-icon>
    Add task
  </button>
</div>
