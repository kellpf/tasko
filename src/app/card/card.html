<div class="card-container" cdkDrag>
  <div class="header">
    <mat-icon aria-hidden="false" aria-label="task icon" fontIcon="drag_indicator"></mat-icon>
    <div class="text">
      <div class="icons">
        <h3>{{ task().title }}</h3>
        <button matButton (click)="togglebutton()">
          <mat-icon>more_horiz</mat-icon>
        </button>
      </div>
      @if (menuOpen()) {
        <div class="custom-menu">
          <button (click)="editTask()">Edit</button>
          <button (click)="deleteTask()">Delete</button>
        </div>
      }
      <p>{{ task().description }}</p>
      <div *cdkDragPlaceholder class="drag-placeholder"></div>
      <app-chip [chips]="task().tags" />
    </div>
  </div>
</div>
